[project]
name = "bottski"
version = "0.1.0"
description = "Sentiment-driven paper-first trading bot (Alpaca + Reddit + news)"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.33",
    "praw>=7.7",
    "vaderSentiment>=3.3.2",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pandas-market-calendars>=4.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bottski = "bottski.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bottski"]

[tool.pytest.ini_options]
testpaths = ["tests"]
